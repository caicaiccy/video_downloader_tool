name: Build portable desktop tools

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build portable executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: BiliDownloader-windows-x64
          path: dist/BiliDownloader-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build app bundle
        run: ./scripts/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: BiliDownloader-macos-${{ matrix.arch }}
          path: dist/BiliDownloader-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
